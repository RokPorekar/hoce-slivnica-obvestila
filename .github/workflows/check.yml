name: Preveri objave Hoče-Slivnica

on:
  schedule:
    - cron: '0 8,16 * * *'
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Prenesi kodo repozitorija
        uses: actions/checkout@v4

      - name: Nastavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Namesti odvisnosti in brskalnik
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Zaženi skripto za preverjanje
        env:
          NTFY_TOPIC: 'hoce-slivnica-obvestila-4Cg560A' # Zamenjaj s svojim kanalom!
        run: |
          python scraper.py

      - name: Shrani spremembe stanja nazaj v repozitorij
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Samodejna posodobitev seznama videnih objav'
          file_pattern: 'seen_posts.json'