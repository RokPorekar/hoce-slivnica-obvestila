name: Preveri objave Hoče-Slivnica

on:
  schedule:
    # Deluje vsak dan ob 8:00 in 16:00 UTC (prilagodi po želji)
    - cron: '0 8,16 * * *'
  workflow_dispatch: # Omogoča ročni zagon preko GitHub vmesnika

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Omogoča commitanje posodobljenega seznama nazaj v repo

    steps:
      - name: Prenesi kodo repozitorija
        uses: actions/checkout@v4

      - name: Nastavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Namesti odvisnosti
        run: |
          pip install requests beautifulsoup4

      - name: Zaženi skripto za preverjanje
        env:
          NTFY_TOPIC: 'hoce-slivnica-obvestila-4Cg560A'
        run: |
          python scraper.py

      - name: Shrani spremembe stanja nazaj v repozitorij
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Samodejna posodobitev seznama videnih objav'
          file_pattern: 'seen_posts.json'